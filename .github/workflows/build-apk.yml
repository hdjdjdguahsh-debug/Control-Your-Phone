name: Build Control Your Phone APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ControlYourPhone-v1.0.0-rc1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlYourPhone-v1.0.0-rc1-debug-APK
          path: ControlYourPhone-v1.0.0-rc1-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Release publishing is intentionally manual until the v1.0.0 APK has been tested on-device.
