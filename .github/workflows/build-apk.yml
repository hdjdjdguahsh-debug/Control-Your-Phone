name: Build Control Your Phone APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ControlYourPhone-v2.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlYourPhone-v2.0.0-debug-APK
          path: ControlYourPhone-v2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2.0.0 GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Align release version with app 2.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Control Your Phone v2.0.0
          generate_release_notes: true
          files: ControlYourPhone-v2.0.0-debug.apk
